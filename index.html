<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FreeCell Solver — Board Input</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="input-page">
  <main class="input-shell">
    <header class="input-header">
      <div class="input-brand-icon" aria-hidden="true">♠</div>
      <div class="input-title-block">
        <p>FREECELL SOLVER</p>
        <h1>Board Input</h1>
      </div>
      <div class="input-header-actions">
        <button id="how-to" class="header-outline" type="button">? How to Use</button>
        <button id="settings" class="header-outline" type="button">⚙ Settings</button>
      </div>
    </header>

    <section class="input-toolbar" aria-label="Board entry controls">
      <div class="entry-status">
        <div><span>ENTERING:</span><strong id="active-column-label">Column 1</strong></div>
        <div class="entry-divider"></div>
        <div><strong id="active-card-label">Card 1 of 7</strong><small id="remaining-label">52 cards remaining</small></div>
      </div>
      <button id="undo-input" class="input-action undo-action" type="button">↶ Undo Last Card</button>
      <button id="clear-board" class="input-action clear-action" type="button">🗑 Clear Board</button>
    </section>

    <section class="input-board-section" aria-label="FreeCell tableau input">
      <div id="input-board" class="input-board"></div>
    </section>

    <section class="keyboard-panel" aria-label="Card keyboard">
      <p class="keyboard-instruction">ⓘ Click a card below to add it to the highlighted position.</p>
      <div id="card-keyboard" class="card-keyboard"></div>
    </section>

    <section class="input-footer-actions">
      <button id="save-board" class="footer-action save-action" type="button">
        <strong>▣ Save Board</strong>
        <small>Save current board to this device</small>
      </button>
      <button id="load-board" class="footer-action load-action" type="button">
        <strong>▱ Load Saved Board</strong>
        <small>Load the most recent saved board</small>
      </button>
      <button id="solve" class="footer-action solve-action" type="button" disabled>
        <strong>⌕ Solve This Board</strong>
        <small id="solve-subtitle">Enter all 52 cards first</small>
      </button>
    </section>

    <p id="input-message" class="input-message" role="status" aria-live="polite"></p>

    <textarea id="board" hidden aria-hidden="true"></textarea>
    <span id="status" hidden></span>
    <div id="stats" hidden></div>
    <ol id="moves" hidden></ol>
    <pre id="error" hidden></pre>
    <a id="open-viewer" href="solution.html" hidden></a>
  </main>

  <script>
    var require = { baseUrl: "js" };
  </script>
  <script src="js/input.js"></script>
  <script src="js/require.js" data-main="solver"></script>
</body>
</html>
