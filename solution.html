<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FreeCell Solution Viewer</title>
  <link rel="stylesheet" href="css/styles.css?v=51">
</head>
<body class="solution-page">
  <main class="game-shell">
    <header class="game-header">
      <a class="gold-button" href="index.html">End</a>
      <div class="title-block">
        <p>FREECELL SOLVER</p>
        <h1>Solution Viewer</h1>
      </div>
      <button class="menu-button" type="button" aria-label="Menu">☰</button>
    </header>

    <section class="top-board" aria-label="Foundations and free cells">
      <div class="slot-group foundations-wrap">
        <h2>Foundations</h2>
        <div id="foundations" class="slot-row"></div>
      </div>
      <div class="slot-group freecells-wrap">
        <h2>Free cells</h2>
        <div id="freecells" class="slot-row"></div>
      </div>
    </section>

    <section class="tableau-area">
      <div id="tableau" class="tableau" aria-label="Eight tableau columns"></div>
    </section>

    <section class="player-panel playback-panel">
      <div class="controls primary-controls">
        <button id="first" type="button">|◀ First</button>
        <button id="previous" type="button">◀ Previous</button>
        <button id="play" class="play" type="button">▶ Play</button>
        <button id="next" type="button">Next ▶</button>
      </div>
      <label class="speed-label" for="speed">Speed
        <select id="speed">
          <option value="1200">Slow</option>
          <option value="700">Normal</option>
          <option value="350" selected>Fast</option>
          <option value="0">Instant</option>
        </select>
      </label>
      <button id="download-solution-log" class="solution-log-button" type="button">⇩ Download Solution Log</button>
      <p id="viewer-error" class="viewer-error" hidden></p>
    </section>

    <section class="viewer-toolbar" aria-label="Solution guidance">
      <div class="speech-controls compact-speech-controls" aria-label="Spoken move controls">
        <div class="speech-toggle-row">
          <label class="speech-toggle">
            <input id="auto-speak" type="checkbox" checked>
            <span>Speak</span>
          </label>
          <label class="speech-toggle">
            <input id="show-captions" type="checkbox" checked>
            <span>Captions</span>
          </label>
        </div>
        <div class="speech-buttons">
          <button id="enable-voice" class="enable-voice" type="button">🔊 Voice</button>
          <button id="speak-move" type="button">Repeat</button>
          <button id="stop-speaking" type="button">■ Stop</button>
        </div>
        <details class="voice-settings">
          <summary>Voice settings</summary>
          <label class="speech-voice-label" for="speech-voice">Voice
            <select id="speech-voice">
              <option value="">Default iPhone voice</option>
            </select>
          </label>
          <label class="speech-rate-label" for="speech-rate">Voice speed
            <select id="speech-rate">
              <option value="0.75">Slower</option>
              <option value="0.9" selected>Normal</option>
              <option value="1.05">Faster</option>
            </select>
          </label>
          <p id="speech-status" class="speech-status" aria-live="polite"></p>
        </details>
      </div>
      <div class="move-readout">
        <strong id="move-counter" class="panel-counter">Move 0 of 0</strong>
        <div class="move-description" id="move-description">Starting position</div>
        <div id="spoken-caption" class="spoken-caption" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <script src="js/cards.js"></script>
  <script src="js/board.js?v=51"></script>
  <script src="js/animation.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/solution.js?v=61"></script>
</body>
</html>
